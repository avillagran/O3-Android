name: Bridge SDK

on:
  push:
    branches: [main]
    paths: ['core/**', 'libs/**', 'scripts/*bridge*', '.github/workflows/bridge-sdk.yml']
  pull_request:
    paths: ['core/**', 'libs/**', 'scripts/*bridge*', '.github/workflows/bridge-sdk.yml']

permissions:
  contents: read

concurrency:
  group: bridge-sdk-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  bridge-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      RUSTUP_TOOLCHAIN: '1.95.0'
      OMABRIDGE_JNI_SYMBOL: Java_dev_avillagran_ot3android_core_bridge_NativeBridge_call
      OMABRIDGE_DIR: ${{ github.workspace }}/bridge-source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Read exact native source
        id: bridge
        run: |
          source=$(sed -n 's/^source=//p' libs/omabridge-native.lock)
          [[ $source =~ ^[0-9a-f]{40}$ ]]
          echo "source=$source" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: avillagran/omabridge
          ref: ${{ steps.bridge.outputs.source }}
          path: bridge-source
          persist-credentials: false
      - name: Native toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustup target add --toolchain "$RUSTUP_TOOLCHAIN" x86_64-linux-android aarch64-linux-android
          sdkmanager 'ndk;28.2.13676358'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Pinned T3 AAR and matching host JNI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(sed -n 's/^tag=//p' libs/lib-t3-rust.lock)
          git clone --depth 1 --branch "$tag" https://github.com/avillagran/lib-t3-rust.git "$RUNNER_TEMP/t3-protocol"
          LIB_T3_RUST_DIR="$RUNNER_TEMP/t3-protocol" scripts/fetch-or-build-lib.sh --release --host-jni
      - name: Native source tests
        working-directory: bridge-source
        run: cargo test --locked --workspace --all-targets -- --test-threads=2
      - name: Production SDK, actual host JNI and packaged app
        run: |
          scripts/build-bridge-sdk.sh
          ./gradlew --no-daemon :core:testDebugUnitTest :core:lintDebug :app:assembleDebug -Pot3a.requireBridgeSdk=true -Pot3a.requireHostJni=true
          mkdir -p "$RUNNER_TEMP/bridge-production/host" "$RUNNER_TEMP/bridge-production/x86_64" "$RUNNER_TEMP/bridge-production/arm64-v8a"
          cp libs/host/linux-x86_64/libomabridge_jni.so libs/host/linux-x86_64/omabridge-native.properties "$RUNNER_TEMP/bridge-production/host/"
          for abi in x86_64 arm64-v8a; do
            cp core/src/main/jniLibs/"$abi"/libomabridge_jni.so core/src/main/jniLibs/"$abi"/omabridge-native.properties "$RUNNER_TEMP/bridge-production/$abi/"
          done
      - name: Debug-only laboratory JNI
        env:
          OMABRIDGE_LAB_TLS: '1'
        run: |
          "$OMABRIDGE_DIR/mobile-sdk/build-jni.sh" host libs/host/linux-x86_64
          "$OMABRIDGE_DIR/mobile-sdk/build-jni.sh" x86_64 core/src/main/jniLibs/x86_64
      - name: Prebuild fixture executables and release cross-compilation cache
        working-directory: bridge-source
        run: |
          cargo build --locked --release --example catalog_mobile_lab --example catalog_t3_lab
          cargo clean --target x86_64-linux-android
          cargo clean --target aarch64-linux-android
      - name: Pinned real T3 executable for isolated servers
        id: t3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stage="$RUNNER_TEMP/t3-lab"
          mkdir -p "$stage/extracted"
          asset=t3-0.1.3-nightly.20261027.3754-linux-x64.tar.gz
          gh release download v0.1.3-nightly.20261027.3754 --repo pingdotgg/t3code --pattern "$asset" --dir "$stage"
          printf '%s  %s\n' ac97dca0fa46e3a5585bdf947c3152c6dd55ac410e5f709474bbc460d936aacf "$stage/$asset" | sha256sum --check
          tar -xzf "$stage/$asset" -C "$stage/extracted"
          mapfile -t binaries < <(rg --files --hidden --no-ignore "$stage/extracted" | rg '(^|/)t3$')
          [[ ${#binaries[@]} == 1 && -x ${binaries[0]} ]]
          echo "binary=${binaries[0]}" >> "$GITHUB_OUTPUT"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real JNI, QUIC, authority and two isolated T3 servers
        uses: reactivecircus/android-emulator-runner@v2
        env:
          T3_LAB_BINARY: ${{ steps.t3.outputs.binary }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-animations: true
          script: python3 scripts/verify-bridge-lab.py --bridge-source "$OMABRIDGE_DIR" --t3-binary "$T3_LAB_BINARY" --serial emulator-5554 --skip-build
      - name: Restore production SDK and reject lab release inputs
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/bridge-production/host/libomabridge_jni.so" ]]; then
            cp "$RUNNER_TEMP/bridge-production/host/"* libs/host/linux-x86_64/
            for abi in x86_64 arm64-v8a; do
              cp "$RUNNER_TEMP/bridge-production/$abi/"* core/src/main/jniLibs/"$abi"/
            done
            ./gradlew --no-daemon :core:verifyReleaseBridgeSdk -Pot3a.requireBridgeSdk=true
          fi
      # Never upload fixture directories, identities, credentials or raw T3 logs.
      - name: Upload bounded test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bridge-sdk-reports
          path: |
            core/build/test-results/**/*.xml
            core/build/outputs/androidTest-results/**/*.xml
          if-no-files-found: ignore
