name: Android

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-latest ships an Android SDK (ANDROID_HOME) with accepted licences;
      # AGP installs any missing platform or build-tools on first use.
      - uses: gradle/actions/setup-gradle@v4

      # lib-t3-rust: the AAR comes from the release pinned in libs/lib-t3-rust.lock; the
      # host JNI library (JVM tests) is built from the commit that AAR was packaged from,
      # since the release ships none. See docs/LIB_BUILD.md. Rust and CMake are preinstalled.
      - name: Read the lib-t3-rust source from the lock
        id: lib
        run: |
          source=$(sed -n 's/^source=//p' libs/lib-t3-rust.lock)
          [[ -n $source ]] || { echo "libs/lib-t3-rust.lock has no source=" >&2; exit 1; }
          echo "source=$source" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: avillagran/lib-t3-rust
          ref: ${{ steps.lib.outputs.source }}
          path: lib-t3-rust
          persist-credentials: false

      - uses: actions/cache@v4
        with:
          path: |
            libs/
            ~/.cargo/registry
            ~/.cargo/git
          key: lib-t3-rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('libs/lib-t3-rust.lock') }}

      - name: lib-t3-rust AAR (release) and host JNI library
        env:
          LIB_T3_RUST_DIR: ${{ github.workspace }}/lib-t3-rust
          GH_TOKEN: ${{ github.token }}
        run: |
          rustc --version && cargo --version && cmake --version | head -1
          scripts/fetch-or-build-lib.sh --release --host-jni
          cat libs/lib-t3-rust-android.properties libs/host/linux-x86_64/lib-t3-rust.properties

      # The bridge SDK is built from the commit pinned in libs/omabridge-native.lock.
      - name: Read the OmaBridge source from the lock
        id: bridge
        run: |
          source=$(sed -n 's/^source=//p' libs/omabridge-native.lock)
          [[ -n $source ]] || { echo "libs/omabridge-native.lock has no source=" >&2; exit 1; }
          echo "source=$source" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: avillagran/omabridge
          ref: ${{ steps.bridge.outputs.source }}
          path: omabridge
          persist-credentials: false

      - name: Bridge SDK for the app and the JVM tests
        env:
          OMABRIDGE_DIR: ${{ github.workspace }}/omabridge
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" >/dev/null
          ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358 scripts/build-bridge-sdk.sh

      # values*/strings_ot3.xml are generated from the catalog in the pinned AAR and
      # committed; a lib bump that changes strings fails here until they are regenerated.
      - name: ot3 strings match the AAR's catalog
        run: |
          python3 -I tools/tests/test_import_ot3_strings.py
          python3 -I tools/import-ot3-strings --check

      # :app:verifyRoborazziDebug runs the app's JVM tests and compares every screenshot
      # with its golden in app/src/test/snapshots/.
      - name: Unit tests, screenshot tests, lint and debug build
        env:
          # JVM tests that load the host libt3_jni.so fail instead of skipping without it.
          OT3A_REQUIRE_HOST_JNI: "1"
        run: >-
          ./gradlew --no-daemon -Pot3a.requireBridgeSdk=true
          :core:testDebugUnitTest
          :app:testDebugUnitTest :app:verifyRoborazziDebug :lucide-vectors:test
          :core:lintDebug :app:lintDebug
          :app:assembleDebug
          :core:assembleDebugAndroidTest :app:assembleDebugAndroidTest

      - name: The debug APK packages libt3_jni.so for four ABIs
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$apk" | grep 'lib/.*/libt3_jni.so' || true
          count=$(unzip -l "$apk" | grep -c 'lib/.*/libt3_jni.so' || true)
          [[ $count == 4 ]] || { echo "expected 4 lib/<abi>/libt3_jni.so in $apk, found $count" >&2; exit 1; }

      - name: The debug APK packages libomabridge_jni.so for two ABIs
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          count=$(unzip -l "$apk" | grep -c 'lib/.*/libomabridge_jni.so' || true)
          [[ $count == 2 ]] || { echo "expected 2 lib/<abi>/libomabridge_jni.so in $apk, found $count" >&2; exit 1; }

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/tests/
            **/build/test-results/**/*.xml
            app/build/outputs/roborazzi/

  # Instrumented tests of :core and :app on an emulator (same image as scripts/emulator.sh,
  # see docs/EMULATOR.md). The emulator is fresh per run, so the app's data starts empty.
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: gradle/actions/setup-gradle@v4

      # Only the AAR: instrumented tests run the Android ABIs, not the host JNI library.
      - name: lib-t3-rust AAR (release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch-or-build-lib.sh --release --no-host-jni

      # Build outside the emulator step so its timeout only covers boot and tests.
      - name: Build the test APKs
        run: ./gradlew --no-daemon :core:assembleDebugAndroidTest :app:assembleDebugAndroidTest

      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-animations: true
          script: ./gradlew --no-daemon :core:connectedDebugAndroidTest :app:connectedDebugAndroidTest

      - name: Upload instrumented test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports
          path: |
            core/build/reports/androidTests/
            core/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
