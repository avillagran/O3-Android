name: Android

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-latest ships an Android SDK (ANDROID_HOME) with accepted licences;
      # AGP installs any missing platform or build-tools on first use.
      - uses: gradle/actions/setup-gradle@v4

      # lib-t3-rust: the AAR comes from the release pinned in libs/lib-t3-rust.lock; the
      # host JNI library (JVM tests) is built from the lib at the same tag, since the
      # release ships none. See docs/LIB_BUILD.md. Rust and CMake are preinstalled.
      - name: Read the lib-t3-rust tag from the lock
        id: lib
        run: |
          tag=$(sed -n 's/^tag=//p' libs/lib-t3-rust.lock)
          [[ -n $tag ]] || { echo "libs/lib-t3-rust.lock has no tag=" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: avillagran/lib-t3-rust
          ref: ${{ steps.lib.outputs.tag }}
          path: lib-t3-rust
          persist-credentials: false

      - uses: actions/cache@v4
        with:
          path: |
            libs/
            ~/.cargo/registry
            ~/.cargo/git
          key: lib-t3-rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('libs/lib-t3-rust.lock') }}

      - name: lib-t3-rust AAR (release) and host JNI library
        env:
          LIB_T3_RUST_DIR: ${{ github.workspace }}/lib-t3-rust
          GH_TOKEN: ${{ github.token }}
        run: |
          rustc --version && cargo --version && cmake --version | head -1
          scripts/fetch-or-build-lib.sh --release --host-jni
          cat libs/lib-t3-rust-android.properties libs/host/linux-x86_64/lib-t3-rust.properties

      - name: Unit tests, lint and debug build
        env:
          # JVM tests that load the host libt3_jni.so fail instead of skipping without it.
          OT3A_REQUIRE_HOST_JNI: "1"
        run: >-
          ./gradlew --no-daemon
          :core:testDebugUnitTest :app:testDebugUnitTest
          :core:lintDebug :app:lintDebug
          :app:assembleDebug
          :core:assembleDebugAndroidTest :app:assembleDebugAndroidTest

      - name: The debug APK packages libt3_jni.so for four ABIs
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$apk" | grep 'lib/.*/libt3_jni.so' || true
          count=$(unzip -l "$apk" | grep -c 'lib/.*/libt3_jni.so' || true)
          [[ $count == 4 ]] || { echo "expected 4 lib/<abi>/libt3_jni.so in $apk, found $count" >&2; exit 1; }

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/tests/
            **/build/test-results/**/*.xml

  # Instrumented tests of :core on an emulator (same image as scripts/emulator.sh, see
  # docs/EMULATOR.md). Only :core: its tests use their own databases and keys, while the
  # :app tests go through the app's data.
  core-instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: gradle/actions/setup-gradle@v4

      # Only the AAR: instrumented tests run the Android ABIs, not the host JNI library.
      - name: lib-t3-rust AAR (release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch-or-build-lib.sh --release --no-host-jni

      # Build outside the emulator step so its timeout only covers boot and tests.
      - name: Build the core test APK
        run: ./gradlew --no-daemon :core:assembleDebugAndroidTest

      - name: Core instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-animations: true
          script: ./gradlew --no-daemon :core:connectedDebugAndroidTest

      - name: Upload instrumented test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-instrumented-reports
          path: |
            core/build/reports/androidTests/
            core/build/outputs/androidTest-results/
